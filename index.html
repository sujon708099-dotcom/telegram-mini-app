<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🔥 ভাইরাল ভিডিও</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#0b0b0f;
  color:white;
  font-family:Arial,sans-serif;
  padding-bottom:75px;
}

header{
  position:sticky;
  top:0;
  z-index:10;
  background:#0b0b0f;
  padding:15px;
}

.logo{
  font-size:24px;
  font-weight:bold;
  margin-bottom:12px;
}

.logo span{
  color:#ff1744;
}

.search{
  width:100%;
  padding:13px 15px;
  border:1px solid #292932;
  border-radius:12px;
  background:#17171e;
  color:white;
  outline:none;
  font-size:15px;
}

.search::placeholder{
  color:#888;
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:5px 15px 15px;
}

.category{
  border:0;
  white-space:nowrap;
  background:#191920;
  color:white;
  padding:9px 15px;
  border-radius:20px;
  font-size:13px;
}

.category.active{
  background:#ff1744;
}

.title{
  padding:5px 15px 12px;
  font-size:20px;
}

.videos{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:0 12px 25px;
}

.card{
  background:#15151b;
  border-radius:14px;
  overflow:hidden;
  cursor:pointer;
  border:1px solid #22222a;
}

.thumb{
  width:100%;
  aspect-ratio:16/10;
  background:linear-gradient(135deg,#292936,#101015);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.thumb video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.play{
  position:absolute;
  width:48px;
  height:48px;
  border-radius:50%;
  background:#ff1744;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
}

.info{
  padding:10px;
}

.name{
  font-size:14px;
  font-weight:bold;
  line-height:1.4;
}

.views{
  color:#999;
  font-size:12px;
  margin-top:5px;
}

.empty{
  grid-column:1/-1;
