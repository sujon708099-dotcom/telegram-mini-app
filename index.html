<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>🔥 ভাইরাল ভিডিও</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0b0b0f;
      color: white;
      font-family: Arial, sans-serif;
      padding-bottom: 30px;
    }

    .header {
      padding: 20px 15px;
      text-align: center;
      background: #111118;
    }

    .header h1 {
      font-size: 24px;
      margin-bottom: 15px;
    }

    .search {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #22222b;
      color: white;
      font-size: 16px;
      outline: none;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 15px;
    }

    .category {
      background: #20202a;
      color: white;
      border: none;
      padding: 9px 15px;
      border-radius: 20px;
      white-space: nowrap;
      cursor: pointer;
    }

    .category:hover {
      background: #33333f;
    }

    .container {
      padding: 0 15px;
    }

    .card {
      background: #16161d;
      border-radius: 14px;
      margin-bottom: 18px;
      overflow: hidden;
    }

    .card video {
      width: 100%;
      display: block;
      background: black;
    }

    .card h2 {
      font-size: 17px;
      padding: 13px 14px 5px;
    }

    .card p {
      color: #aaa;
      font-size: 13px;
      padding: 0 14px 14px;
    }

    .no-result {
      text-align: center;
      color: #999;
      padding: 30px;
      display: none;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>🔥 ভাইরাল ভিডিও</h1>

    <input
      type="text"
      id="search"
      class="search"
      placeholder="🔍 ভিডিও খুঁজুন..."
    >
  </div>

  <div class="categories">
    <button class="category" onclick="filterVideos('all')">সব ভিডিও</button>
    <button class="category" onclick="filterVideos('viral')">🔥 ভাইরাল</button>
    <button class="category" onclick="filterVideos('funny')">😂 মজার</button>
    <button class="category" onclick="filterVideos('music')">🎵 মিউজিক</button>
  </div>

  <div class="container">

    <div class="card" data-category="viral" data-title="আজকের ভাইরাল ভিডিও">
      <video controls preload="metadata">
        <source
          src="https://www.w3schools.com/html/mov_bbb.mp4"
          type="video/mp4"
        >
        আপনার ব্রাউজার ভিডিও চালাতে পারে না।
      </video>

      <h2>🔥 আজকের ভাইরাল ভিডিও</h2>
      <p>আজকের জনপ্রিয় ভিডিও</p>
    </div>

    <div class="card" data-category="funny" data-title="মজার ভিডিও">
      <video controls preload="metadata">
        <source
          src="https://www.w3schools.com/html/movie.mp4"
          type="video/mp4"
        >
        আপনার ব্রাউজার ভিডিও চালাতে পারে না।
      </video>

      <h2>😂 নতুন মজার ভিডিও</h2>
      <p>মজার ও বিনোদনমূলক ভিডিও</p>
    </div>

    <div class="card" data-category="music" data-title="মিউজিক ভিডিও">
      <video controls preload="metadata">
        <source
          src="https://www.w3schools.com/html/mov_bbb.mp4"
          type="video/mp4"
        >
        আপনার ব্রাউজার ভিডিও চালাতে পারে না।
      </video>

      <h2>🎵 ভাইরাল মিউজিক ভিডিও</h2>
      <p>ট্রেন্ডিং মিউজিক</p>
    </div>

    <div class="card" data-category="viral" data-title="ট্রেন্ডিং ভিডিও">
      <video controls preload="metadata">
        <source
          src="https://www.w3schools.com/html/movie.mp4"
          type="video/mp4"
        >
        আপনার ব্রাউজার ভিডিও চালাতে পারে না।
      </video>

      <h2>🔥 আজকের ট্রেন্ডিং</h2>
      <p>সবার পছন্দের ট্রেন্ডিং ভিডিও</p>
    </div>

    <div id="noResult" class="no-result">
      কোনো ভিডিও পাওয়া যায়নি।
    </div>

  </div>

  <script>
    const searchBox = document.getElementById("search");
    const cards = document.querySelectorAll(".card");
    const noResult = document.getElementById("noResult");

    searchBox.addEventListener("input", function () {
      const text = this.value.toLowerCase();
      let found = false;

      cards.forEach(function (card) {
        const title = card.dataset.title.toLowerCase();

        if (title.includes(text)) {
          card.style.display = "block";
          found = true;
        } else {
          card.style.display = "none";
        }
      });

      noResult.style.display = found ? "none" : "block";
    });

    function filterVideos(category) {
      let found = false;

      cards.forEach(function (card) {
        if (category === "all" || card.dataset.category === category) {
          card.style.display = "block";
          found = true;
        } else {
          card.style.display = "none";
        }
      });

      noResult.style.display = found ? "none" : "block";
    }

    if (window.Telegram && Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }
  </script>

</body>
</html>
